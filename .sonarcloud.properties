# Configuration for SonarCloud Automatic Analysis.
# This file is only read when Automatic Analysis is enabled for the project in
# SonarCloud (Administration -> Analysis Method). There is no CI workflow —
# SonarCloud pulls the repo itself on push.
# https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/automatic-analysis/

sonar.sources=.

# Jekyll build output and dependency lockfiles are generated, not hand-written
# source, so they should not be analyzed or counted toward metrics.
sonar.exclusions=_site/**,vendor/**,Gemfile.lock
