<section class="projects" aria-labelledby="projects-title">
  <h2 class="section-title" id="projects-title">Projects</h2>

  {% for p in site.data.projects %}
  <article class="entry">
    <h3>
      {% if p.link %}<a href="{{ p.link }}">{{ p.title | escape }}</a>{% else %}{{ p.title | escape }}{% endif %}
    </h3>
    <p>{{ p.desc | escape }}</p>
  </article>
  {% endfor %}
</section>
