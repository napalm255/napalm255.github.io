<section class="skills" aria-labelledby="skills-title">
  <h2 class="section-title" id="skills-title">Skills</h2>

  {% for group in site.data.skills %}
  <div class="skill-group">
    <h3>{{ group.title | escape }}</h3>
    <ul class="tag-list">
    {% for item in group.items %}
      <li>{{ item | escape }}</li>
    {% endfor %}
    </ul>
  </div>
  {% endfor %}
</section>
