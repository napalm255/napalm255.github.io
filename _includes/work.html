<section class="work" aria-labelledby="work-title">
  <h2 class="section-title" id="work-title">Work Experience</h2>

  {% for w in site.data.work %}
  <article class="entry">
    <div class="entry-head">
      <h3>{{ w.title | escape }} <span class="org">&middot; {{ w.org | escape }}</span></h3>
      <span class="time">
        {{ w.startTime | escape }}{% if w.endTime and w.endTime != w.startTime %}&ndash;{{ w.endTime | escape }}{% endif %}
      </span>
    </div>
    <ul class="bullets">
    {% for d in w.desc %}
      <li>{{ d | escape }}</li>
    {% endfor %}
    </ul>
  </article>
  {% endfor %}
</section>
