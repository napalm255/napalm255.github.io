<ul class="contact-list">
{% for c in site.data.contact %}
  {% for i in c.items %}
  <li>
    <span class="label" aria-hidden="true">{{ c.title | escape }}</span>
    <a href="{{ i.link }}" aria-label="{{ c.title | escape }}: {{ i.label | escape }}">{{ i.label | escape }}</a>
  </li>
  {% endfor %}
{% endfor %}
</ul>
