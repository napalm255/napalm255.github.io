<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ site.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="{{ site.name }}">
  <meta name="description" content="{{ site.description }}">
  <link rel="canonical" href="{{ site.url }}/">
  <link rel="icon" href="favicon.ico">

  <meta property="og:type" content="profile">
  <meta property="og:site_name" content="{{ site.name }}">
  <meta property="og:title" content="{{ site.name }} &middot; {{ site.position }}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:url" content="{{ site.url }}/">
  <meta property="og:image" content="{{ site.url }}/images/user.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{ site.name }} &middot; {{ site.position }}">
  <meta name="twitter:description" content="{{ site.description }}">
  <meta name="twitter:image" content="{{ site.url }}/images/user.png">

  <link rel="stylesheet" href="assets/main.css">
</head>

<body>
  <header class="site-header">
    <img class="avatar" src="images/user.png" alt="{{ site.name }}" width="96" height="96">
    <div class="identity">
      <h1>{{ site.name }}</h1>
      <p class="role">{{ site.position }}</p>
      {% include contact.html %}
    </div>
  </header>

  <main>
    {% include skills.html %}
    {% include work.html %}
    {% include education.html %}
    {% include projects.html %}
  </main>
</body>
</html>
